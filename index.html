<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curry Munchery Academy</title>
    <style>
      :root {
        --bg: #0f0f0f;
        --surface: #1a1a1a;
        --accent: #ff7a00;
        --text: #f8f8f8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: radial-gradient(circle at top, #1f1f1f 0%, var(--bg) 60%);
        color: var(--text);
      }

      main {
        width: min(900px, 92vw);
        text-align: center;
        background: var(--surface);
        border: 2px solid var(--accent);
        border-radius: 16px;
        padding: 3rem 1.5rem;
        box-shadow: 0 0 24px rgba(255, 122, 0, 0.3);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3.75rem);
        letter-spacing: 0.04em;
        color: var(--accent);
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Curry Munchery Academy</h1>
    </main>
  </body>
</html>
